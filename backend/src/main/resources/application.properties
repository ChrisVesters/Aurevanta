spring.application.name=aurevanta

# Schema is owned by Flyway; Hibernate only verifies that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Docker Compose support starts compose.yaml automatically on `mvn spring-boot:run`
# and wires the datasource from it, so no spring.datasource.* is needed for local dev.
spring.docker.compose.lifecycle-management=start_and_stop

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Access tokens. The secret is deliberately unset here: leaving it empty makes each start
# generate a random key, which is fine for a single developer machine and refuses to be a
# known key checked into version control. Set AUREVANTA_SECURITY_JWT_SECRET (32+ chars)
# anywhere tokens must survive a restart or be shared between instances.
aurevanta.security.jwt.issuer=aurevanta
aurevanta.security.jwt.access-token-ttl=12h

# Outbound mail. The transport is plain SMTP so that adopting a provider is configuration
# rather than code: every transactional provider publishes an SMTP endpoint, so production
# differs only in these properties (host, credentials, STARTTLS). Dev points at the Mailpit
# container in compose.yaml, which captures mail and delivers none of it.
spring.mail.host=localhost
# Matches the port compose.yaml publishes Mailpit on; see the comment there for why it is
# not Mailpit's usual 1025. Both read AUREVANTA_SMTP_PORT so they cannot drift apart.
spring.mail.port=${AUREVANTA_SMTP_PORT:2525}

# How much mail one recipient, or one source address, can be made to provoke. Counted in
# this process only, so running more than one instance multiplies the effective limit by
# the number of them — see CLAUDE.md before scaling out.
aurevanta.rate-limit.per-address=3
aurevanta.rate-limit.address-window=15m
aurevanta.rate-limit.per-ip=20
aurevanta.rate-limit.ip-window=15m

# base-url is where links in mail point, which is the frontend rather than this service —
# the backend behind a proxy cannot discover its own public URL, so it is told.
aurevanta.mail.from=no-reply@localhost
aurevanta.mail.base-url=http://localhost:5173

# Errors are reported as RFC 9457 problem documents.
spring.mvc.problemdetails.enabled=true
