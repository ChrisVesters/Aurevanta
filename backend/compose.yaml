name: 'aurevanta-backend'

services:
  postgres:
    image: 'postgres:18'
    environment:
      - 'POSTGRES_DB=aurevanta'
      - 'POSTGRES_USER=aurevanta'
      - 'POSTGRES_PASSWORD=aurevanta'
    ports:
      - '5432:5432'
    volumes:
      - 'aurevanta-postgres:/var/lib/postgresql'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aurevanta -d aurevanta']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aurevanta-postgres:
