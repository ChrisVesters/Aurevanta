name: 'aurevanta-backend'

services:
  postgres:
    image: 'postgres:18'
    environment:
      - 'POSTGRES_DB=aurevanta'
      - 'POSTGRES_USER=aurevanta'
      - 'POSTGRES_PASSWORD=aurevanta'
    ports:
      - '5432:5432'
    volumes:
      - 'aurevanta-postgres:/var/lib/postgresql'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aurevanta -d aurevanta']
      interval: 5s
      timeout: 5s
      retries: 10

  # Captures outbound mail and delivers none of it, so developing against real addresses
  # cannot reach a real inbox. Read what was sent at http://localhost:8025.
  mailpit:
    image: 'axllent/mailpit:v1.27'
    ports:
      # Published on 2525 rather than Mailpit's usual 1025, because 1025 is contended:
      # plenty of desktop software binds it, and macOS lets one process hold IPv4
      # 127.0.0.1:1025 while Docker holds IPv6 *:1025. Nothing then fails to start — but
      # a client resolving localhost to IPv4 reaches the other process, which accepts the
      # connection and never speaks SMTP. Different runtimes resolve differently, so the
      # same setup appears to work from one language and not another. 2525 is a recognised
      # alternative submission port and far less crowded. Override with AUREVANTA_SMTP_PORT
      # if it clashes too; spring.mail.port reads the same variable.
      - '${AUREVANTA_SMTP_PORT:-2525}:1025' # SMTP, where spring.mail.* points
      - '8025:8025' # web UI
    environment:
      - 'MP_SMTP_AUTH_ACCEPT_ANY=1'
      - 'MP_SMTP_AUTH_ALLOW_INSECURE=1'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aurevanta-postgres:
